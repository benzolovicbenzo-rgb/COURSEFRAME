<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX EHO — Закрытая платформа аттестации старших аналитиков</title>
  <!-- Подключение шрифта Inter и Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ==========================================================================
       1. ПЕРЕМЕННЫЕ ДИЗАЙН-СИСТЕМЫ (DARK GLASSMORPHISM)
       ========================================================================== */
    :root {
      --bg-deep: #050505;
      --bg-elevated: #0a0a0a;
      --glass-surface: rgba(255, 255, 255, 0.03);
      --glass-surface-hover: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-bright: rgba(0, 255, 0, 0.35);
      --glass-blur: blur(16px);

      --neon-green: #00ff00;
      --neon-green-dim: rgba(0, 255, 0, 0.14);
      --neon-green-glow: 0 0 20px rgba(0, 255, 0, 0.35), 0 0 40px rgba(0, 255, 0, 0.12);
      --neon-text-shadow: 0 0 12px rgba(0, 255, 0, 0.75), 0 0 28px rgba(0, 255, 0, 0.35);

      --danger-red: #ff2a4b;
      --danger-glow: 0 0 25px rgba(255, 42, 75, 0.5);

      --text-main: #f5f5f7;
      --text-secondary: #9a9aa6;
      --text-muted: #5e5e6a;

      --sidebar-width: 310px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==========================================================================
       2. БАЗОВЫЙ СБРОС И ТИПОГРАФИКА
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Фоновые радиальные неоновые пятна */
    .ambient-glow {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.45;
    }

    .ambient-glow--top {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(0, 255, 0, 0.14) 0%, rgba(0, 0, 0, 0) 70%);
      top: -180px;
      right: 10%;
    }

    .ambient-glow--bottom {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 255, 0, 0.09) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -240px;
      left: 15%;
    }

    /* Фирменный брендинг APEX EHO */
    .brand-logo {
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .brand-logo .apex {
      color: #ffffff;
    }

    .brand-logo .eho {
      color: var(--neon-green);
      text-shadow: var(--neon-text-shadow);
    }

    /* ==========================================================================
       3. АНИМАЦИИ И ЭФФЕКТЫ ЭКРАНА
       ========================================================================== */
    @keyframes fadeInSlideUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-10px); }
      30%, 60%, 90% { transform: translateX(10px); }
    }

    /* Полноэкранная вспышка при сдаче или провале теста */
    .screen-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9000;
      opacity: 0;
      backdrop-filter: blur(6px);
      transition: opacity 0.35s var(--ease-ios);
    }

    .screen-flash.flash-red {
      background: radial-gradient(circle at center, rgba(255, 42, 75, 0.28) 0%, rgba(255, 0, 30, 0.48) 100%);
      box-shadow: inset 0 0 120px rgba(255, 42, 75, 0.75);
      opacity: 1;
    }

    .screen-flash.flash-green {
      background: radial-gradient(circle at center, rgba(0, 255, 0, 0.2) 0%, rgba(0, 255, 0, 0.38) 100%);
      box-shadow: inset 0 0 120px rgba(0, 255, 0, 0.65);
      opacity: 1;
    }

    /* ==========================================================================
       4. ЭКРАН АВТОРИЗАЦИИ (ЗАКРЫТЫЙ ДОСТУП)
       ========================================================================== */
    #auth-screen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: radial-gradient(circle at 50% 35%, #0d150d 0%, var(--bg-deep) 65%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.6s var(--ease-ios), visibility 0.6s var(--ease-ios), transform 0.6s var(--ease-ios);
    }

    #auth-screen.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.04);
      pointer-events: none;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--glass-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(0, 255, 0, 0.05);
      animation: fadeInSlideUp 0.7s var(--ease-ios);
    }

    .auth-badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--neon-green);
      background: var(--neon-green-dim);
      border: 1px solid rgba(0, 255, 0, 0.3);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .auth-card .brand-logo {
      font-size: 34px;
      margin-bottom: 12px;
      justify-content: center;
    }

    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .auth-input-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .auth-input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 15px;
      font-family: monospace;
      letter-spacing: 0.08em;
      text-align: center;
      outline: none;
      transition: all 0.25s var(--ease-ios);
    }

    .auth-input::placeholder {
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      letter-spacing: normal;
    }

    .auth-input:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 18px rgba(0, 255, 0, 0.2);
      background: rgba(0, 255, 0, 0.03);
    }

    .auth-input.input-error {
      animation: shakeError 0.45s var(--ease-ios);
      border-color: var(--danger-red) !important;
      background: rgba(255, 42, 75, 0.12) !important;
      box-shadow: var(--danger-glow) !important;
      color: #ffb3be;
    }

    .auth-error-msg {
      min-height: 20px;
      font-size: 13px;
      color: var(--danger-red);
      margin-bottom: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .auth-error-msg.visible {
      opacity: 1;
    }

    /* Универсальная неоновая кнопка */
    .btn-neon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 28px;
      background: rgba(0, 255, 0, 0.1);
      color: #ffffff;
      border: 1px solid rgba(0, 255, 0, 0.45);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      backdrop-filter: var(--glass-blur);
      transition: all 0.3s var(--ease-ios);
      box-shadow: 0 0 18px rgba(0, 255, 0, 0.18);
      text-decoration: none;
    }

    .btn-neon:hover {
      background: rgba(0, 255, 0, 0.22);
      border-color: var(--neon-green);
      box-shadow: var(--neon-green-glow);
      transform: translateY(-2px);
    }

    .btn-neon:active {
      transform: translateY(0);
    }

    /* ==========================================================================
       5. ОСНОВНОЙ ЛЕЙАУТ ДАШБОРДА (SIDEBAR + CONTENT)
       ========================================================================== */
    #app-dashboard {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.6s var(--ease-ios);
    }

    #app-dashboard.visible {
      opacity: 1;
    }

    /* Боковая панель навигации */
    .sidebar {
      width: var(--sidebar-width);
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-right: 1px solid var(--glass-border);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 28px 20px;
      transition: transform 0.35s var(--ease-ios);
    }

    .sidebar-header {
      padding: 0 10px 24px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 20px;
    }

    .sidebar-header .brand-logo {
      font-size: 24px;
    }

    .sidebar-status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
    }

    /* Прогресс-бар в сайдбаре */
    .progress-box {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .progress-meta strong {
      color: var(--neon-green);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--neon-green);
      box-shadow: 0 0 12px var(--neon-green);
      transition: width 0.5s var(--ease-ios);
    }

    /* Список модулей */
    .module-nav {
      list-style: none;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .module-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s var(--ease-ios);
      text-align: left;
    }

    .module-nav-item:hover:not(.locked) {
      background: var(--glass-surface-hover);
      border-color: var(--glass-border);
    }

    .module-nav-item.active {
      background: rgba(0, 255, 0, 0.09);
      border-color: rgba(0, 255, 0, 0.4);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.12);
    }

    .module-nav-item.locked {
      opacity: 0.5;
      cursor: not-allowed;
      color: var(--text-secondary);
    }

    .module-nav-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .module-index {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
    }

    .module-nav-item.active .module-index {
      color: var(--neon-green);
    }

    .module-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .module-icon {
      font-size: 14px;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-logout {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .btn-logout:hover {
      color: var(--danger-red);
    }

    /* Мобильная шапка с гамбургером */
    .mobile-topbar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      z-index: 950;
      padding: 0 20px;
      align-items: center;
      justify-content: space-between;
    }

    .hamburger-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text-main);
      transition: all 0.3s var(--ease-ios);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 990;
    }

    /* ==========================================================================
       6. КОНТЕНТНАЯ ОБЛАСТЬ И СТЕКЛЯННЫЕ КАРТОЧКИ
       ========================================================================== */
    .main-area {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 56px 40px 100px;
      display: flex;
      justify-content: center;
    }

    .content-container {
      width: 100%;
      max-width: 860px;
      animation: fadeInSlideUp 0.55s var(--ease-ios);
    }

    .glass-card {
      background: var(--glass-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 42px;
      margin-bottom: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .module-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--neon-green);
      background: var(--neon-green-dim);
      border: 1px solid rgba(0, 255, 0, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .module-title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .longread h3 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin: 32px 0 14px;
      letter-spacing: -0.01em;
    }

    .longread p {
      color: #d2d2dc;
      margin-bottom: 18px;
      font-size: 16px;
    }

    .longread ul {
      margin: 0 0 22px 20px;
      color: #d2d2dc;
      list-style-type: disc;
    }

    .longread li {
      margin-bottom: 10px;
    }

    .longread strong {
      color: #ffffff;
    }

    /* Строгий выделенный блок с обязательным заданием */
    .strict-requirement-box {
      margin: 32px 0;
      padding: 28px;
      background: radial-gradient(circle at top left, rgba(0, 255, 0, 0.12), rgba(255, 255, 255, 0.02) 70%);
      border: 1px solid rgba(0, 255, 0, 0.45);
      border-left: 4px solid var(--neon-green);
      border-radius: var(--radius-md);
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.08);
    }

    .strict-requirement-header {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--neon-green);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .platform-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .platform-pill {
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 255, 0, 0.4);
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(0, 255, 0, 0.15);
    }

    /* ==========================================================================
       7. СЕКЦИЯ ЖЕСТКОГО ТЕСТИРОВАНИЯ
       ========================================================================== */
    .test-trigger-wrap {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .quiz-drawer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.75s var(--ease-ios), opacity 0.45s var(--ease-ios), margin-top 0.45s var(--ease-ios);
    }

    .quiz-drawer.open {
      max-height: 8000px;
      opacity: 1;
      margin-top: 28px;
    }

    .question-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 20px;
    }

    .question-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all 0.2s var(--ease-ios);
      font-size: 14px;
      color: #d2d2dc;
    }

    .option-label:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .option-label input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-secondary);
      border-radius: 50%;
      margin-top: 2px;
      flex-shrink: 0;
      position: relative;
      transition: all 0.2s ease;
    }

    .option-label input[type="radio"]:checked {
      border-color: var(--neon-green);
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
    }

    .option-label input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-green);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ==========================================================================
       8. ФИНАЛЬНАЯ ВОРОНКА (МОДУЛЬ 8)
       ========================================================================== */
    .funnel-hero {
      text-align: center;
      padding: 52px 36px;
      background: radial-gradient(circle at 50% 0%, rgba(0, 255, 0, 0.16), rgba(255, 255, 255, 0.02) 70%);
      border: 1px solid rgba(0, 255, 0, 0.4);
    }

    .funnel-quote {
      font-size: 20px;
      font-weight: 500;
      color: #ffffff;
      max-width: 680px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }

    .funnel-condition {
      display: inline-block;
      padding: 14px 24px;
      background: rgba(0, 255, 0, 0.07);
      border: 1px solid rgba(0, 255, 0, 0.3);
      border-radius: var(--radius-md);
      color: #d8ffd8;
      font-size: 14px;
      margin-bottom: 36px;
    }

    .funnel-cta-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 12px;
    }

    .btn-cert,
    .btn-deposit {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 26px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      transition: all 0.35s var(--ease-ios);
    }

    .btn-cert {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid rgba(0, 255, 0, 0.5);
      box-shadow: 0 0 22px rgba(0, 255, 0, 0.18);
    }

    .btn-cert:hover {

      /**

       */
      const MODULES_DATA = [
        {
          id: 1,
          title: 'Фундаментальная база распределенных реестров (Web3) и децентрализация архитектуры данных',
          shortTitle: 'База Web3 и Реестры',
          isFinal: false,
          contentHTML: `
            <div class="longread">
              <p>Забудьте всё, что вы читали в популярных блогах. Финансовые и информационные рынки не прощают когнитивных искажений, инфантилизма и поверхностного взгляда на архитектуру данных. Статистика неумолима: <strong>99% непрофессионалов статистически обречены на потерю капитала из-за отсутствия дисциплины</strong> и непонимания того, как устроена инфраструктура, в которую они заводят ликвидность. В кризисной аналитике выживают только люди с холодным математическим расчетом, способные видеть за красивым пользовательским интерфейсом детерминированные алгоритмы, криптографические примитивы и жесткую теорию игр.</p>

              <h3>1. Крах централизованной парадигмы и переход к одноранговой репликации</h3>
              <p>Классическая архитектура Web2 строится вокруг клиент-серверной модели с единой точкой отказа — <strong>SPOF (Single Point of Failure)</strong>. Когда данные о балансах, деривативах, праве собственности и маржинальном обеспечении хранятся в закрытой реляционной базе данных одного корпоративного контрагента, аналитик находится в полной зависимости от чужой воли. Любой технический сбой дата-центра, несанкционированное изменение записей администратором или принудительная заморозка шлюза мгновенно обнуляют доступ к активам. Децентрализованная архитектура Web3 решает эту фундаментальную уязвимость путем замены доверия к институту на <strong>математическую верификацию</strong> в одноранговой сети (Peer-to-Peer), где идентичная копия канонического состояния реестра (State) синхронно хранится на тысячах независимых узлов (нод).</p>

              <h3>2. Задача византийских генералов и стоимость консенсуса</h3>
              <p>В распределенной среде, где участники не знают друг друга и часть узлов может действовать злонамеренно (искажать транзакции, задерживать пакеты данных или пытаться провести двойное расходование средств — <strong>Double Spending</strong>), возникает классическая «Задача византийских генералов». Чтобы сеть обладала византийской отказоустойчивостью (<strong>BFT — Byzantine Fault Tolerance</strong>), протокол обязан гарантировать математическое согласие большинства честных узлов относительно единой истории блоков, пока доля скомпрометированных участников не превышает критический порог (в классических BFT-системах — менее одной трети от общего числа валидаторов).</p>

              <p>Достижение консенсуса никогда не бывает бесплатным: за безопасность реестра система платит либо колоссальными термодинамическими затратами в алгоритме <strong>Proof-of-Work (PoW)</strong>, где майнеры соревнуются в переборе криптографического параметра Nonce, либо заморозкой капитала в <strong>Proof-of-Stake (PoS)</strong>. В архитектуре PoS валидатор вносит собственные активы в качестве своеобразного <strong>маржинального обеспечения</strong> честности: любая попытка подписать противоречивый блок или саботировать работу сети приводит к активации механизма <strong>слэшинга (Slashing)</strong> — принудительной алгоритмической конфискации (ликвидации) части или всего заблокированного стейка.</p>

              <h3>3. Криптографический фундамент: хеш-функции, лавинный эффект и деревья Меркла</h3>
              <p>Неизменяемость (Immutability) блокчейна держится на односторонних криптографических хеш-функциях, таких как <strong>SHA-256</strong> или <strong>Keccak-256</strong>. Эти функции преобразуют массив входящих данных произвольной длины в битовую строку фиксированного размера (дайджест). Ключевое свойство криптографического хеширования — <strong>лавинный эффект</strong>: изменение даже одного бита, одной запятой в истории транзакций на уровне старого блока приводит к радикальному, непредсказуемому изменению итогового хеша. Поскольку каждый последующий блок содержит в своем заголовке хеш предыдущего родительского блока, попытка задним числом фальсифицировать запись разрушит всю криптографическую цепь вплоть до текущего состояния.</p>

              <p>Чтобы аналитическим системам и «легким клиентам» (Light Nodes) не приходилось скачивать терабайты архивных данных для проверки одной-единственной операции, транзакции внутри блока упаковываются в бинарное <strong>дерево Меркла (Merkle Tree)</strong>. Хеши отдельных транзакций попарно объединяются и снова хешируются, пока на вершине пирамиды не образуется единый корневой хеш — <strong>Merkle Root</strong>. Это позволяет математически доказать факт включения транзакции в блок (Merkle Proof) со сложностью <strong>O(log n)</strong>, затрачивая миллисекунды вместо часов.</p>

              <h3>4. Асимметричная криптография и жестокость персональной ответственности</h3>
              <p>В децентрализованных реестрах не существует понятий «аккаунт», «пароль» или «служба техподдержки банка». Доступ к ликвидности регулируется асимметричной криптографией на эллиптических кривых (например, стандарт <strong>ECDSA</strong> на кривой secp256k1 или Ed25519). Участник владеет парой ключей: закрытым (приватным) ключом, который генерируется из энтропии (мнемонической seed-фразы), и вычисляемым из него публичным ключом, производным от которого выступает адрес в сети. Приватный ключ создает цифровую подпись транзакции, подтверждающую право распоряжения активами без раскрытия самого ключа в открытом эфире. Запомните аксиому: потеря приватного ключа или подписание вредоносного разрешения означает мгновенную и необратимую потерю капитала. Рынок не примет ваших апелляций.</p>

              <h3>5. Детерминизм смарт-контрактов и экономика вычислительного газа</h3>
              <p>Переход от распределенной бухгалтерской книги первого поколения к программируемым финансам стал возможен благодаря внедрению <strong>смарт-контрактов</strong> — неизменяемых фрагментов программного кода, исполняемых внутри изолированной виртуальной машины (такой как <strong>EVM — Ethereum Virtual Machine</strong> или <strong>TVM</strong>). Смарт-контракт — это автономный цифровой агент: он удерживает ликвидность, проверяет условия, рассчитывает спред, управляет деривативами и принудительно вызывает ликвидацию позиций при падении обеспечения ниже порога. Поскольку виртуальная машина является Тьюринг-полной, для защиты сети от бесконечных циклов (проблема остановки Тьюринга) и DDoS-атак каждая элементарная операция процессора (опкод) тарифицируется в единицах вычислительной работы — <strong>газе (Gas)</strong>. Если лимит газа (Gas Limit), выделенный инициатором транзакции, исчерпывается до завершения алгоритма, происходит откат состояния (<strong>Revert</strong>): все изменения аннулируются, но комиссия за уже затраченные ресурсы валидаторов списывается безвозвратно.</p>

              <h3>6. Мемпул, «темный лес» MEV и микроструктура включения транзакций</h3>
              <p>Дилетанты полагают, что отправленная транзакция сразу попадает в блокчейн. В реальности до включения в блок она поступает в публичный зал ожидания — <strong>мемпул (Mempool)</strong>. Это зона жесткой дарвиновской конкуренции. Валидаторы и сборщики блоков (Builders) сортируют очередь транзакций не по времени их поступления, а по размеру предложенной приоритетной комиссии (Priority Fee). Здесь в игру вступает понятие <strong>MEV (Maximal Extractable Value)</strong> — максимальной извлекаемой стоимости. Алгоритмические боты-хищники непрерывно сканируют мемпул: обнаружив крупный рыночный ордер неопытного участника с широким допуском проскальзывания, бот выставляет собственную транзакцию с более высоким газом строго перед жертвой (<strong>Front-running</strong>) и продает актив сразу после неё (<strong>Back-running</strong>). Эта механика называется «сэндвич-атакой» (Sandwich Attack): жертва получает исполнение по худшей цене, искусственно оплачивая расширенный спред из собственного кармана.</p>

              <h3>7. Проблема оракулов и архитектурная трилемма</h3>
              <p>Поскольку виртуальная машина блокчейна обязана быть строго детерминированной (каждая нода в любой точке планеты при прогоне истории с первого блока должна прийти к одному и тому же биту результата), смарт-контракт технически изолирован от внешнего мира и не может самостоятельно сделать HTTP-запрос к внешнему API биржи. Возникает <strong>«Проблема оракулов» (Oracle Problem)</strong>: как безопасно передать в смарт-контракт внешние котировки для расчета маржинального обеспечения или экспирации деривативов? Использование централизованного оракула возвращает нас к единой точке отказа. Поэтому промышленные протоколы используют децентрализованные сети оракулов, агрегирующие данные из десятков независимых источников ликвидности.</p>

              <p>В завершение первого теоретического блока зафиксируйте в памяти <strong>Трилемму блокчейна</strong>, сформулированную Виталиком Бутериным: ни одна распределенная система на базовом уровне (Layer 1) не способна одновременно максимизировать все три свойства — <strong>Децентрализацию, Безопасность и Масштабируемость (пропускную способность)</strong>. Усиление любых двух параметров неизбежно достигается за счет компромисса в третьем. Аналитик, который не проверяет архитектурные компромиссы сети перед аллокацией капитала, становится донором ликвидности для тех, кто читает документацию и исходный код.</p>

              <p>Картина «Маржин Колл» (Margin Call) блестяще иллюстрирует крах корпоративного риск-менеджмента. В центре сюжета — инвестиционный банк, чья математическая модель оценки рисков (VaR — Value at Risk) внезапно показывает, что историческая волатильность активов на балансе превысила все заложенные пороги. Институциональные модели подвели, потому что не учитывали «толстые хвосты» (Fat Tails) распределения и беспрецедентные отклонения. Главный принцип выживания на Уолл-стрит в момент кризиса звучит предельно цинично: <strong>«Будь первым, будь умнее или обманывай»</strong>. Институция выбирает быть первой: руководство инициирует принудительную распродажу (Fire Sale) токсичных активов своим же клиентам и партнерам.</p>

              <p>Репутация банка уничтожается за один день, но математически он выживает, сбросив радиоактивный риск на контрагентов. Аналитик должен усвоить фундаментальный урок: когда музыка останавливается, ликвидность в книге ордеров исчезает перманентно. Спасается не тот, кто ждет подтверждения тренда, а тот, кто выходит в деньги (кеш) до начала всеобщей паники.</p>

              <h3>2. Системная слепота и конфликт интересов (по фильму «Игра на понижение»)</h3>
              <p>«Игра на понижение» (The Big Short) детально препарирует анатомию системной слепоты и извращенных стимулов. Мировой кризис 2008 года был спровоцирован CDO (обеспеченными долговыми обязательствами), базирующимися на мусорной (субпрайм) ипотеке. Банкиры наивно полагали, что рынки недвижимости в разных штатах Америки не коррелируют между собой. Это была фатальная <strong>иллюзия диверсификации</strong>. Когда дефолты заемщиков стали массовыми, корреляция между ипотечными пулами стремительно приблизилась к абсолютной единице (Systemic Risk).</p>

              <p>Почему система не била тревогу? Из-за преступного конфликта интересов. Рейтинговые агентства (S&P, Moody's), которые должны были выступать независимыми аудиторами, получали прибыль напрямую от создателей этих деривативов. В результате они бесперебойно присваивали токсичным мусорным траншам наивысший рейтинг безопасности AAA. Герой фильма Майкл Бьюрри нашел истину не в красивых презентациях и не в сводках телевизионных новостей. Он пришел к своему выводу благодаря скрупулезному чтению сотен страниц сырых проспектов эмиссии (первичных данных), обнаружив, что фундамент системы гнилой.</p>

              <h3>3. Риск платежеспособности и Синтетические деривативы</h3>
              <p>Бьюрри также столкнулся с колоссальным психологическим и финансовым давлением: он оказался прав, но слишком рано. В финансовом мире быть правым раньше времени часто эквивалентно неправоте. Удержание короткой позиции (шорта) против рынка недвижимости требовало регулярной выплаты многомиллионных страховых премий. Эта ситуация идеально описывает <strong>риск платежеспособности (Solvency Risk)</strong>: иррациональные рынки могут оставаться иррациональными гораздо дольше, чем вы сможете поддерживать маржинальное обеспечение своей позиции.</p>

              <p>Масштаб катастрофы 2008 года был возведен в абсолют благодаря <strong>Синтетическим CDO</strong>. Это инструменты абсурда — деривативы, выпущенные на основе других деривативов. Если классический CDO состоял из реальных ипотечных кредитов, то синтетический состоял из кредитных дефолтных свопов (CDS) на эти CDO. Это математически умножило риски в десятки раз, превратив локальный кризис невыплат в глобальный экономический коллапс. Чем выше уровень абстракции финансового инструмента от реального актива, тем более разрушительным будет схлопывание пузыря.</p>

              <h3>4. Манипуляция розничной толпой (по фильму «Волк с Уолл-стрит»)</h3>
              <p>Третий обязательный материал — «Волк с Уолл-стрит» (The Wolf of Wall Street). За фасадом корпоративного разврата скрывается жестокая, циничная механика манипуляции неквалифицированной розничной толпой. Брокерская фирма Стрэттон Окмонт использовала классическую нелегальную схему <strong>Pump and Dump (Накачка и Сброс)</strong> на рынке грошовых микрокапитализированных акций (Penny Stocks). Манипуляторы заранее скупали мусорные активы, а затем через холодные звонки агрессивно «впаривали» их доверчивым клиентам, искусственно взвинчивая цену (Pump). На пике эйфории организаторы сбрасывали свои портфели (Dump).</p>

              <p>Почему толпа раз за разом покупала откровенный мусор? Из-за примитивной человеческой жадности, желания быстрого обогащения и эмоционального давления брокеров, генерирующих искусственный дефицит и синдром FOMO. В любой подобной схеме розничный инвестор всегда выступает в роли конечной <strong>«выходной ликвидности» (Exit Liquidity)</strong>. Этот же хищнический алгоритм сегодня ежедневно воспроизводится на рынках низколиквидных альткоинов и мем-токенов.</p>

              <h3>5. Моральный риск (Moral Hazard) и ваша персональная защита</h3>
              <p>Любой системный кризис вскрывает феномен <strong>Морального риска (Moral Hazard)</strong>. Когда правительства спасают крупные корпорации и банки от банкротства за счет денег налогоплательщиков (Bailout), они посылают рынку опасный сигнал: «Вы можете брать на себя безумные неограниченные риски, потому что вы слишком велики, чтобы рухнуть (Too Big To Fail)». Это стимулирует систему к еще большей безответственности в будущем. Но помните: вас никто спасать не будет. Вы, как независимый аналитик, не имеете права рассчитывать на помощь государства или биржи. Ваша единственная линия защиты — это маниакальный контроль объема позиции и жесткий, автоматизированный стоп-лосс.</p>

              <p>Во время затяжных бычьих рынков (Bull Runs) голос риск-менеджеров в корпорациях всегда заглушается агрессивным отделом продаж. Причина проста: риск-менеджеры генерируют для фирмы издержки, а трейдеры генерируют миллионные бонусы. Эта корпоративная шизофрения ведет к тому, что предупреждения об опасности игнорируются вплоть до наступления маржин-колла. Ваша задача — быть безжалостным внутренним риск-менеджером для собственного капитала 24 часа в сутки.</p>

          // Неверный пароль: тряска (shake) и красное свечение
          authPasswordInput.classList.remove('input-error');
          void authPasswordInput.offsetWidth; // принудительный reflow для перезапуска анимации
          authPasswordInput.classList.add('input-error');
          authErrorMsg.classList.add('visible');

          setTimeout(() => {
            authPasswordInput.classList.remove('input-error');
          }, 500);
        }
      });

      // Сброс контура (выход)
      resetSessionBtn.addEventListener('click', function () {
        localStorage.removeItem(STORAGE_KEY);
        appState = { ...defaultState };
        authPasswordInput.value = '';
        closeMobileSidebar();
        initApp();
      });

      // ============================================================================
      // МОБИЛЬНОЕ МЕНЮ (ГАМБУРГЕР)
      // ============================================================================
      function toggleMobileSidebar() {
        sidebar.classList.toggle('open');
        sidebarBackdrop.classList.toggle('open');
      }

      function closeMobileSidebar() {
        sidebar.classList.remove('open');
        sidebarBackdrop.classList.remove('open');
      }

      hamburgerBtn.addEventListener('click', toggleMobileSidebar);
      sidebarBackdrop.addEventListener('click', closeMobileSidebar);

      // ============================================================================
      // РЕНДЕРИНГ ДАШБОРДА, НАВИГАЦИИ И АКТИВНОГО МОДУЛЯ
      // ============================================================================
      function renderDashboard() {
        // Проверка безопасности: не позволяем открыть заблокированный модуль
        if (appState.activeModule > appState.unlockedModule) {
          appState.activeModule = appState.unlockedModule;
          saveState();
        }

        renderSidebar();
        renderModuleContent(appState.activeModule);
      }

      function renderSidebar() {
        const completedCount = appState.completedModules.length;
        const percent = Math.min(100, Math.round((completedCount / 7) * 100));
        progressLabel.textContent = `${completedCount} / 7`;
        progressFill.style.width = `${percent}%`;

        moduleNav.innerHTML = '';

        MODULES_DATA.forEach((mod) => {
          const isUnlocked = mod.id <= appState.unlockedModule;
          const isCompleted = appState.completedModules.includes(mod.id);
          const isActive = mod.id === appState.activeModule;

          const li = document.createElement('li');
          li.className = 'module-nav-item';
          if (isActive) li.classList.add('active');
          if (!isUnlocked) li.classList.add('locked');

          let statusSymbol = '🔒';
          if (isCompleted) {
            statusSymbol = '✅';
          } else if (isUnlocked) {
            statusSymbol = mod.isFinal ? '⚡' : '●';
          }

          li.innerHTML = `
            <div class="module-nav-left">
              <span class="module-index">Модуль 0${mod.id}</span>
              <span class="module-name">${mod.shortTitle}</span>
            </div>
            <span class="module-icon">${statusSymbol}</span>
          `;

          if (isUnlocked) {
            li.addEventListener('click', () => {
              appState.activeModule = mod.id;
              saveState();
              closeMobileSidebar();
              renderDashboard();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          }

          moduleNav.appendChild(li);
        });
      }

      function renderModuleContent(moduleId) {
        const mod = MODULES_DATA.find((m) => m.id === moduleId);
        if (!mod) return;

        // Перезапуск анимации появления контента
        contentRoot.style.animation = 'none';
        void contentRoot.offsetWidth;
        contentRoot.style.animation = 'fadeInSlideUp 0.55s var(--ease-ios)';

        // Если это Финальная Воронка (Модуль 8)
        if (mod.isFinal) {
          contentRoot.innerHTML = `
            <article class="glass-card funnel-hero">
              <div class="module-tag">Финальный протокол // Допуск к ядру получен</div>
              <h1 class="module-title">Академический рубеж пройден. Добро пожаловать в реальность.</h1>
              <p class="funnel-quote">
                «Вы прошли через методологическую мясорубку. 99% кандидатов ломаются на этапе осознания собственной иррациональности или сжигают депозиты из-за неконтролируемого кредитного плеча. Вы доказали свою интеллектуальную стрессоустойчивость и академическую дисциплину. 
                <br><br>
                Но сухая теория без практики — это лишь интеллектуальная гимнастика. Теперь настало время столкнуться с сырым, токсичным и беспощадным рынком. Мы допускаем вас в закрытый контур APEX EHO. Здесь нет учебных счетов и права на эмоциональную слабость. Здесь вас ждут реальные алгоритмы, инсайдерские графы ликвидности и жесткий институциональный поток ордеров. Оставьте эго за порогом. Оперируйте вероятностями. Защищайте капитал. Игра начинается.»
              </p>
              <div class="funnel-condition">
                СТАТУС: Аттестация подтверждена. Доступ в VIP-канал разблокирован.
              </div>
              <div class="funnel-cta-group">
                <a href="https://i.ibb.co/whQKm3q0/photo-2026-10-29-17-12-51.jpg" target="_blank" class="btn-cert">Скачать сертификат</a>
                <a href="https://t.me/APEX_CURATOR" target="_blank" class="btn-deposit">Перейти в рабочий канал</a>
              </div>
            </article>
          `;
          return;
        }

        // Стандартный образовательный модуль (1–7) со скрытым тестом
        const isPassed = appState.completedModules.includes(mod.id);

        const questionsHTML = mod.questions
          .map((qItem, qIdx) => {
            const optionsHTML = qItem.options
              .map(
                (optText, optIdx) => `
                <label class="option-label">
                  <input type="radio" name="q_${qIdx}" value="${optIdx}" />
                  <span>${optText}</span>
                </label>
              `
              )
              .join('');

            return `
              <div class="question-card">
                <div class="question-title">${qItem.q}</div>
                <div class="options-list">${optionsHTML}</div>
              </div>
            `;
          })
          .join('');

        contentRoot.innerHTML = `
          <article class="glass-card">
            <div class="module-tag">
              <span>Модуль 0${mod.id} из 08</span>
              ${isPassed ? '<span>• Аттестация сдана ✓</span>' : '<span>• Ожидает аттестации</span>'}
            </div>
            <h1 class="module-title">${mod.title}</h1>

            ${mod.contentHTML}

            <div class="test-trigger-wrap">
              <button id="open-quiz-btn" class="btn-neon">
                Я изучил материал, готов к тесту
              </button>
            </div>

            <div id="quiz-drawer" class="quiz-drawer">
              <form id="quiz-form">
                ${questionsHTML}
                <button type="submit" class="btn-neon">Проверить</button>
              </form>
            </div>
          </article>
        `;

        // Привязка обработчиков раскрытия и проверки теста
        const openQuizBtn = document.getElementById('open-quiz-btn');
        const quizDrawer = document.getElementById('quiz-drawer');
        const quizForm = document.getElementById('quiz-form');

        openQuizBtn.addEventListener('click', () => {
          quizDrawer.classList.add('open');
          setTimeout(() => {
            quizDrawer.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 150);
        });

        quizForm.addEventListener('submit', (e) => {
          e.preventDefault();
          evaluateQuiz(mod, quizForm);
        });
      }

      // ============================================================================
      // МЕХАНИКА ЖЕСТКОГО ТЕСТИРОВАНИЯ (БЕСПОЩАДНЫЙ СБРОС ИЛИ РАЗБЛОКИРОВКА)
      // ============================================================================
      function evaluateQuiz(mod, formElement) {
        let isAllCorrect = true;

        mod.questions.forEach((qItem, qIdx) => {
          const selected = formElement.querySelector(`input[name="q_${qIdx}"]:checked`);
          if (!selected || Number(selected.value) !== qItem.correct) {
            isAllCorrect = false;
          }
        });

        if (!isAllCorrect) {
          // БЕСПОЩАДНЫЙ СБРОС: обнуляем все выбранные радио-кнопки
          formElement.reset();

          // Кратковременная заливка экрана красным стеклянным свечением
          triggerScreenFlash('red');

          // Модальное окно со строгим предупреждением
          showModal({
            type: 'error',
            icon: '⚠️',
            title: 'Критическая ошибка аттестации',
            message:
              'Ошибка в ответах. Вы проявили невнимательность. В больших данных и аналитике это стоит критических потерь. Пройдите тест заново'
          });
        } else {
          // УСПЕШНАЯ СДАЧА
          triggerScreenFlash('green');

          if (!appState.completedModules.includes(mod.id)) {
            appState.completedModules.push(mod.id);
          }

          const nextModuleId = Math.min(8, mod.id + 1);
          if (appState.unlockedModule < nextModuleId) {
            appState.unlockedModule = nextModuleId;
          }
          appState.activeModule = nextModuleId;
          saveState();

          showModal({
            type: 'success',
            icon: '⚡',
            title: 'Аттестация пройдена',
            message: `Рубежный контроль Модуля 0${mod.id} успешно сдан. Доступ к Модулю 0${nextModuleId} разблокирован.`,
            onConfirm: () => {
              renderDashboard();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          });
        }
      }

      function triggerScreenFlash(color) {
        screenFlash.className = 'screen-flash';
        void screenFlash.offsetWidth;
        screenFlash.classList.add(color === 'red' ? 'flash-red' : 'flash-green');

        setTimeout(() => {
          screenFlash.className = 'screen-flash';
        }, 700);
      }

      let modalCallback = null;

      function showModal({ type, icon, title, message, onConfirm }) {
        modalBox.className = 'modal-box ' + (type === 'error' ? 'modal-error' : 'modal-success');
        modalIcon.textContent = icon;
        modalTitle.textContent = title;
        modalText.textContent = message;
        modalCallback = typeof onConfirm === 'function' ? onConfirm : null;
        modalOverlay.classList.add('active');
      }

      modalCloseBtn.addEventListener('click', () => {
        modalOverlay.classList.remove('active');
        if (modalCallback) {
          const cb = modalCallback;
          modalCallback = null;
          cb();
        }
      });

      // Запуск приложения
      window.onload = function () {
        initApp();
      };
    })();
  </script>
</body>
</html>
